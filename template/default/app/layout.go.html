<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.title}}</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        header {
            background: #000;
            color: white;
            padding: 1rem 0;
        }
        nav {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            display: flex;
            gap: 2rem;
        }
        nav a {
            color: white;
            text-decoration: none;
        }
        nav a:hover {
            text-decoration: underline;
        }
        main {
            min-height: calc(100vh - 200px);
            padding: 2rem 0;
        }
        footer {
            background: #f5f5f5;
            padding: 2rem 0;
            text-align: center;
        }
    </style>
    {{if .hotReload}}
    {{.hotReload}}
    {{end}}
</head>
<body>
    <header>
        <nav>
            <a href="/">Home</a>
            <a href="/about">About</a>
            <a href="/blog">Blog</a>
        </nav>
    </header>
    
    <main>
        <div class="container">
            {{.children}}
        </div>
    </main>
    
    <footer>
        <p>Built with Next.go - The Go Implementation of Next.js</p>
    </footer>
</body>
</html>
